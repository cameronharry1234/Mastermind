<style>
  @import url('https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --sky-deep:#123a72;
    --sky-deep-2:#1a4a8f;
    --sky:#2f7de8;
    --sky-bright:#5b9dfb;
    --sky-pale:#eaf3ff;
    --sky-pale-2:#dcebff;
    --white:#ffffff;
    --ink:#152238;
    --ink-dim:#5c6d88;
    --line:#c9dcf5;
    --gold:#e0a83f;
    --gold-bright:#f0bd5e;
    --gold-pale:#fdf3e2;
    --azure-vivid:rgb(51,153,255);
    --ember:#d9682f;
    --ember-bright:#f5934a;
    --ember-hot:#ffd27a;
  }
  *{ box-sizing:border-box; }

  .ms-root{
    background:
      radial-gradient(1200px 620px at 12% -12%, #dcebff 0%, transparent 58%),
      radial-gradient(1000px 560px at 105% 5%, #eef6ff 0%, transparent 55%),
      linear-gradient(180deg, #ffffff 0%, #f7fbff 100%);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100%;
    line-height:1.55;
  }

  .ms-shell{ max-width:760px; margin:0 auto; padding:0 20px 100px; }

  /* --- Nav / letterhead --- */
  .ms-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:34px 0 22px;
    border-bottom:1px solid var(--line);
    margin-bottom:8px;
  }
  .ms-brand{
    font-family:'Spectral',serif;
    font-weight:600;
    font-size:21px;
    letter-spacing:.02em;
    color:var(--ink);
    display:flex; align-items:center; gap:10px;
  }
  .ms-brand .ms-mark{
    width:26px; height:26px;
    border:1.4px solid var(--gold);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono',monospace;
    font-size:11px; color:var(--gold);
  }
  .ms-tabs{ display:flex; gap:4px; }
  .ms-tab-btn{
    font-family:'Spectral',serif;
    font-weight:400;
    font-size:14px;
    letter-spacing:.01em;
    text-transform:none;
    background:none;
    border:1px solid transparent;
    color:var(--ink-dim);
    padding:8px 16px;
    border-radius:3px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .ms-tab-btn:hover{ color:var(--ink); }
  .ms-tab-btn.ms-active{
    color:var(--sky-deep);
    border-color:rgba(111,155,245,.5);
    background:rgba(59,111,224,.09);
    font-style:italic;
  }

  .ms-eyebrow{
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--gold);
    display:flex; align-items:center; gap:10px;
    margin:40px 0 18px;
  }
  .ms-eyebrow::before{ content:''; width:22px; height:1px; background:var(--gold); display:inline-block; }

  h1.ms-title{
    font-family:'Spectral',serif;
    font-weight:600;
    font-size:clamp(32px,5.6vw,48px);
    line-height:1.08;
    margin:0 0 16px;
    letter-spacing:-.01em;
  }
  h1.ms-title em{ font-style:italic; font-weight:500; color:var(--sky-bright); }

  .ms-sub{ color:var(--ink-dim); font-size:16px; max-width:56ch; margin:0 0 36px; }
  .ms-sub-dim{ color:var(--ink-dim); font-size:14px; max-width:58ch; }

  .ms-session-banner{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--sky-pale);
    border:1px solid var(--line);
    border-radius:4px;
    padding:12px 16px;
    margin-bottom:28px;
    font-size:13.5px;
  }
  .ms-session-label{ font-family:'Space Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); }
  .ms-session-value{ font-family:'Spectral',serif; font-size:15px; color:var(--sky-deep); }
  .ms-session-edit-btn{
    margin-left:auto;
    background:none; border:none; color:var(--sky);
    font-family:'Space Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    cursor:pointer; text-decoration:underline; text-underline-offset:3px; padding:0;
  }
  .ms-session-edit{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; width:100%; }
  .ms-session-edit .ms-input{ width:auto; padding:8px 10px; font-size:13px; }
  .ms-session-edit .ms-btn{ padding:8px 14px; }

  /* --- Facet wheel (signature element) --- */
  .ms-wheel-block{
    display:flex; align-items:center; gap:32px;
    margin:8px 0 48px;
    flex-wrap:wrap;
  }
  .ms-wheel-svg{ flex:0 0 auto; }
  .ms-facet-list{ display:flex; flex-direction:column; gap:10px; flex:1; min-width:220px; }
  .ms-facet-item{
    display:flex; align-items:baseline; gap:10px;
    font-size:13.5px; color:var(--ink-dim);
    padding:8px 10px;
    border-left:2px solid transparent;
    transition:border-color .2s ease, background .2s ease;
  }
  .ms-facet-item .ms-dot{ width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
  .ms-facet-item .ms-facet-name{ font-family:'Spectral',serif; font-size:15px; color:var(--ink); }
  .ms-facet-item .ms-facet-desc{ color:var(--ink-dim); font-size:12.5px; }

  /* --- Ask the mentor --- */
  .ms-ask-card{
    background:#ffffff;
    border:1px solid #c9dcf5;
    border-radius:6px;
    padding:28px;
    margin-bottom:20px;
    box-shadow:0 20px 44px -28px rgba(20,60,120,.3);
  }
  .ms-ask-card h2{
    font-family:'Spectral',serif;
    font-size:22px;
    font-weight:600;
    margin:0 0 6px;
    color:#152238;
  }
  textarea.ms-input, input.ms-input{
    width:100%;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    padding:12px 14px;
    resize:vertical;
    transition:border-color .15s ease, background .15s ease;
  }
  textarea.ms-input:focus, input.ms-input:focus{
    outline:none;
    border-color:var(--sky-bright);
    background:var(--sky-pale);
  }
  textarea.ms-input{ min-height:90px; margin:14px 0 16px; }

  .ms-btn{
    font-family:'Space Mono',monospace;
    font-size:12px;
    letter-spacing:.07em;
    text-transform:uppercase;
    background:var(--sky);
    color:#fff;
    border:none;
    padding:13px 24px;
    border-radius:2px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .ms-btn:hover{ background:var(--sky-bright); }
  .ms-btn:active{ transform:translateY(1px); }
  .ms-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .ms-btn-ghost{
    background:transparent;
    color:var(--ink-dim);
    border:1px solid rgba(18,58,114,0.43);
  }
  .ms-btn-ghost:hover{ color:var(--sky-deep); border-color:var(--sky-bright); background:rgba(59,111,224,.08); }
  .ms-btn-gold{ background:var(--gold); color:#3a2705; }
  .ms-btn-gold:hover{ background:#eab655; }

  .ms-mentor-reply{
    margin-top:20px;
    background:var(--white);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:4px;
    padding:22px 24px;
  }
  .ms-mentor-reply .ms-reply-facet{
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--sky);
    margin-bottom:10px;
  }
  .ms-mentor-reply p{ font-size:14.5px; margin:0 0 10px; }
  .ms-mentor-reply p:last-child{ margin-bottom:0; }

  /* --- Chat thread --- */
  .ms-thread{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin:18px 0 20px;
    max-height:560px;
    overflow-y:auto;
    padding-right:4px;
  }
  .ms-thread:empty{ display:none; }
  .ms-msg{ display:flex; }
  .ms-msg-user{ justify-content:flex-end; }
  .ms-msg-mastermind{ justify-content:flex-start; }
  .ms-bubble{
    max-width:82%;
    padding:13px 16px;
    border-radius:5px;
    font-size:14px;
    line-height:1.55;
  }
  .ms-bubble p{ margin:0 0 8px; }
  .ms-bubble p:last-child{ margin-bottom:0; }
  .ms-msg-user .ms-bubble{
    background:var(--sky);
    color:#fff;
    border-bottom-right-radius:1px;
  }
  .ms-msg-mastermind .ms-bubble{
    background:#ffffff;
    color:#152238;
    border:1px solid #c9dcf5;
    border-bottom-left-radius:1px;
  }
  .ms-ask-card .ms-sub-dim{
    color:#5c6d88;
  }
  .ms-bubble-label{
    font-family:'Space Mono',monospace;
    font-size:9.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:6px;
    display:block;
  }
  .ms-chat-input-row{ display:flex; gap:10px; align-items:flex-end; margin-top:6px; }
  .ms-chat-input-row textarea.ms-input{ margin:0; flex:1; min-height:52px; }
  .ms-chat-controls{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .ms-reset-link{
    background:none; border:none; color:var(--ink-dim);
    font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
    cursor:pointer; text-decoration:underline; text-underline-offset:3px; padding:0;
  }
  .ms-reset-link:hover{ color:var(--sky-bright); }

  .ms-loading{
    display:flex; align-items:center; gap:12px;
    font-family:'Space Mono',monospace;
    font-size:13px; color:var(--sky-deep);
    padding:14px 0;
  }
  .ms-spinner{
    width:15px; height:15px;
    border:2px solid rgba(111,155,245,.3);
    border-top-color:var(--sky-bright);
    border-radius:50%;
    animation:ms-spin .8s linear infinite;
  }
  @keyframes ms-spin{ to{ transform:rotate(360deg); } }

  .ms-error{ color:#e0806b; font-size:13px; margin-top:10px; font-family:'Space Mono',monospace; }

  /* --- Roundtable form --- */
  .ms-notice{
    font-size:12.5px; color:var(--ink-dim);
    background:rgba(59,111,224,.08);
    border:1px solid rgba(59,111,224,.25);
    border-radius:3px;
    padding:11px 14px;
    margin-bottom:32px;
  }
  .ms-entry{ border-top:1px solid rgba(18,58,114,0.24); padding:24px 0 6px; }
  .ms-entry:last-of-type{ border-bottom:1px solid rgba(18,58,114,0.24); }
  .ms-entry-head{ display:flex; align-items:baseline; gap:12px; margin-bottom:8px; }
  .ms-num{ font-family:'Space Mono',monospace; font-size:12px; color:var(--gold); min-width:22px; }
  .ms-label{ font-family:'Spectral',serif; font-size:18px; font-weight:600; color:var(--ink); }
  .ms-optional{ font-family:'Space Mono',monospace; font-size:10px; color:var(--ink-dim); letter-spacing:.06em; text-transform:uppercase; }
  .ms-help{ color:var(--ink-dim); font-size:13px; margin:0 0 12px 34px; max-width:56ch; }
  .ms-field-wrap{ margin-left:34px; margin-bottom:16px; }
  .ms-radios{ display:flex; flex-direction:column; gap:8px; margin-left:34px; }
  .ms-radio{
    display:flex; align-items:center; gap:10px;
    font-size:13.5px; color:var(--ink-dim);
    cursor:pointer; padding:9px 12px;
    border:1px solid rgba(18,58,114,0.28);
    border-radius:3px;
    transition:all .15s ease;
  }
  .ms-radio:hover{ border-color:rgba(111,155,245,.7); color:var(--sky-deep); }
  .ms-radio.ms-checked{ border-color:var(--sky-bright); color:var(--sky-deep); background:rgba(59,111,224,.1); }
  .ms-radio input{ accent-color:var(--sky); }

  .ms-facet-tag{
    display:inline-block;
    font-family:'Space Mono',monospace;
    font-size:9.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--gold);
    border:1px solid rgba(201,163,94,.4);
    border-radius:20px;
    padding:2px 8px;
    margin-left:8px;
    vertical-align:middle;
  }

  .ms-actions{ display:flex; gap:12px; align-items:center; margin-top:34px; flex-wrap:wrap; }

  /* --- One-sheet --- */
  .ms-onesheet{
    background:#ffffff;
    color:#152238;
    border:1px solid var(--line);
    border-radius:6px;
    padding:0;
    margin-top:8px;
    overflow:hidden;
    box-shadow:0 18px 40px -20px rgba(20,60,120,.25);
  }
  .ms-onesheet-header{
    background:var(--sky-deep);
    color:#ffffff;
    padding:26px 30px;
    display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:10px;
  }
  .ms-onesheet-header .ms-os-brand{
    font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold);
  }
  .ms-onesheet-header h2{ font-family:'Spectral',serif; font-size:26px; font-weight:600; margin:4px 0 0; }
  .ms-onesheet-header .ms-os-date{ font-family:'Space Mono',monospace; font-size:11px; color:#a9c3ea; }
  .ms-onesheet-body{ padding:28px 30px 32px; }
  .ms-os-section{ margin-bottom:22px; }
  .ms-os-section h3{
    font-family:'Spectral',serif; font-size:15px; font-weight:700;
    color:var(--sky); text-transform:uppercase; letter-spacing:.03em;
    margin:0 0 4px; display:flex; align-items:center; gap:8px;
  }
  .ms-os-section .ms-os-source{
    font-family:'Space Mono',monospace; font-size:10px; color:#8a95a8; text-transform:none; letter-spacing:0; font-weight:400;
  }
  .ms-os-section p, .ms-os-section li{ font-size:14px; color:#28324a; }
  .ms-os-section ul{ margin:6px 0 0; padding-left:18px; }
  .ms-os-section li{ margin-bottom:6px; }
  .ms-os-divider{ border:none; border-top:1px solid rgba(20,20,20,.12); margin:20px 0; }

  @media print{
    .ms-nav, .ms-actions, .ms-footer-note, .ms-notice{ display:none !important; }
    .ms-root{ background:#fff; color:#000; }
    .ms-onesheet{ box-shadow:none; }
  }

  /* --- Roster --- */
  .ms-roster-item{
    border-top:1px solid rgba(18,58,114,0.22);
    padding:14px 0; display:flex; justify-content:space-between; align-items:baseline; gap:12px;
  }
  .ms-roster-name{ font-family:'Spectral',serif; font-size:16px; }
  .ms-roster-meta{ font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-dim); }
  .ms-roster-actions{ display:flex; gap:10px; margin-left:auto; }
  .ms-roster-action-btn{
    background:none; border:none; cursor:pointer;
    font-family:'Space Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--sky); text-decoration:underline; text-underline-offset:3px; padding:0;
  }
  .ms-roster-action-btn:hover{ color:var(--sky-deep); }
  .ms-roster-delete-btn{ color:#c0503c; }
  .ms-roster-delete-btn:hover{ color:#9a3d2d; }

  .ms-footer-note{
    margin-top:60px; font-family:'Space Mono',monospace; font-size:10.5px;
    color:var(--ink-dim); text-align:center; letter-spacing:.05em;
  }

  /* --- The Forge --- */
  .ms-forge-viewer{
    display:flex; flex-direction:column;
    border:1px solid var(--line); border-radius:8px; overflow:hidden;
    height:75vh; min-height:420px; margin:14px 0 8px;
    box-shadow:0 20px 44px -28px rgba(20,60,120,.35);
  }
  .ms-forge-viewer:fullscreen, .ms-forge-viewer:-webkit-full-screen{ height:100vh; border-radius:0; margin:0; }
  .ms-forge-banner{
    flex:0 0 10%; min-height:60px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:0 20px;
    background:linear-gradient(120deg, #1a1206 0%, #3d2a04 60%, #5a3d08 100%);
    color:#fff;
    flex-wrap:wrap;
  }
  .ms-forge-banner-name{ font-family:'Spectral',serif; font-size:17px; font-weight:600; white-space:nowrap; }
  .ms-forge-banner-title{
    font-family:'Spectral',serif; font-style:italic; font-weight:600; font-size:18px; letter-spacing:.04em;
    color:var(--gold-bright); white-space:nowrap;
  }
  .ms-forge-pdf-area{
    flex:1 1 auto; min-height:0;
    background:#20242c;
    position:relative;
    overflow:hidden;
  }
  .ms-forge-pdf-frame{
    display:block; width:100%; height:100%; border:none; background:#525659;
  }
  .ms-forge-pdf-download{
    position:absolute; top:12px; right:12px; z-index:3;
    width:40px; height:40px; border-radius:50%;
    background:rgba(18,16,10,.88);
    -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px);
    color:#f0e4c8; font-size:16px; text-decoration:none;
    display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(224,168,63,.35);
  }
  .ms-forge-pdf-download:hover{ background:rgba(30,26,16,.95); }
  .ms-forge-viewer.ms-forge-pseudo-fullscreen{
    position:fixed; inset:0; z-index:9999; border-radius:0; margin:0;
  }
  .ms-forge-placeholder{
    color:#b7c2d6; font-family:'Space Mono',monospace; font-size:13px; text-align:center; padding:20px;
  }
  .ms-forge-clock{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .ms-forge-mode-toggle{ display:flex; gap:2px; }
  .ms-forge-mode-btn{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); color:#e8d9b8;
    font-size:14px; padding:5px 8px; cursor:pointer; border-radius:3px;
  }
  .ms-forge-mode-btn.ms-active{ background:var(--gold); color:#2a1a02; border-color:var(--gold); }
  .ms-forge-clock-display{
    font-family:'Space Mono',monospace; font-size:22px; letter-spacing:.05em; color:#fff; min-width:76px; text-align:center;
  }
  .ms-forge-clock-controls{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .ms-forge-laps-panel{
    position:absolute; top:calc(100% + 8px); right:0; z-index:5;
    background:#1a1410; border:1px solid rgba(224,168,63,.4); border-radius:5px;
    padding:10px 14px; max-height:200px; overflow-y:auto;
    font-family:'Space Mono',monospace; font-size:11.5px; color:#e8d9b8;
    min-width:150px;
  }
  .ms-forge-fullscreen-btn{ font-size:16px; padding:8px 12px; flex:0 0 auto; }
  .ms-forge-source-bar{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    background:#2a2010; color:#e8d9b8; padding:10px 20px;
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.03em;
    border-bottom:1px solid rgba(224,168,63,.3);
  }
  .ms-forge-source-label{ flex:1; min-width:180px; }
  .ms-forge-source-toggle{ display:flex; gap:6px; }
  .ms-forge-source-btn{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.25); color:#e8d9b8;
    font-family:'Space Mono',monospace; font-size:11px; padding:7px 14px; border-radius:16px; cursor:pointer;
  }
  .ms-forge-source-btn.ms-active{ background:var(--gold); color:#2a1a02; border-color:var(--gold); }
  .ms-forge-source-remove{
    background:none; border:1px solid rgba(255,255,255,.25); color:#e8d9b8;
    width:26px; height:26px; border-radius:50%; cursor:pointer; font-size:12px; flex:0 0 auto;
  }
  @media (max-width:700px){
    .ms-forge-banner{ flex-direction:column; align-items:flex-start; gap:10px; padding:12px 16px; min-height:auto; }
    .ms-forge-viewer{ height:80vh; }
    .ms-forge-source-bar{ flex-direction:column; align-items:flex-start; }
  }

  @media (max-width:560px){
    .ms-shell{ padding:0 14px 70px; }
    .ms-help, .ms-field-wrap, .ms-radios{ margin-left:0; }
    .ms-wheel-block{ flex-direction:column; align-items:flex-start; gap:20px; }
    .ms-nav{ flex-direction:column; align-items:stretch; gap:14px; padding:22px 0 18px; }
    .ms-tabs{ width:100%; }
    .ms-tab-btn{ flex:1; text-align:center; padding:11px 10px; }
    .ms-ask-card{ padding:18px 16px; }
    .ms-onesheet-header{ padding:20px 18px; flex-direction:column; align-items:flex-start; gap:6px; }
    .ms-onesheet-body{ padding:20px 18px 26px; }
    .ms-entry-head{ flex-wrap:wrap; row-gap:4px; }
    .ms-chat-input-row{ flex-direction:column; align-items:stretch; }
    .ms-chat-input-row .ms-btn{ width:100%; }
    .ms-bubble{ max-width:92%; }
    .ms-actions{ flex-direction:column; align-items:stretch; }
    .ms-actions .ms-btn, .ms-actions .ms-btn-ghost{ width:100%; text-align:center; }
    .ms-radio{ font-size:13px; }
    h1.ms-title{ line-height:1.12; }
    .ms-thread{ max-height:60vh; }
    textarea.ms-input, input.ms-input{ font-size:16px; }
    .ms-session-edit .ms-input{ font-size:16px; }
  }

  @media (max-width:380px){
    .ms-brand{ font-size:18px; }
    .ms-eyebrow{ font-size:10px; }
    .ms-label{ font-size:16.5px; }
  }

  /* --- Text-to-speech controls --- */
  .ms-speak-btn{

  // ---------- About page: reading list ----------
  const READING_LIST = [
    { title:"Rich Dad Poor Dad", author:"Robert T. Kiyosaki", pillar:"Finance",
      desc:"Kiyosaki structures the book around two contrasting father figures from his own life — his highly-educated biological father, who chased job security and never got ahead, and a friend's father, a school-dropout entrepreneur who built real wealth. The core argument is that schools teach people to work for money but not how to make money work for them, and that most financial struggle comes from confusing liabilities (things that take money out of your pocket, like a bigger house or a nicer car) with assets (things that put money into it, like rental property, businesses, or dividend-paying stock). Kiyosaki pushes readers to treat financial literacy — reading a balance sheet, understanding taxes, spotting a genuinely good deal — as a skill to be actively studied, not something that arrives automatically with a paycheck. The book is light on hard numbers and heavy on mindset, which is both its main criticism and its main appeal: it's meant to shift how you see money, not hand you a spreadsheet." },
    { title:"Rich Dad's Cashflow Quadrant", author:"Robert T. Kiyosaki", pillar:"Finance",
      desc:"A direct follow-up that gives Kiyosaki's philosophy a usable map: four quadrants — Employee, Self-Employed, Business owner, and Investor — representing fundamentally different relationships to income. E and S trade time directly for money and hit a ceiling no matter how skilled they get; B and I generate income that isn't tied to their own hours, through systems and capital respectively. The book argues most people are taught from childhood to aim for the E quadrant (get a safe job) when lasting wealth is built by deliberately moving toward B and I — even if that means starting a small business on the side while still employed, or learning to invest seriously rather than just saving. It's less about abandoning a job overnight and more about understanding which quadrant your current effort is actually building toward." },
    { title:"Rich Dad's Guide to Investing", author:"Robert T. Kiyosaki", pillar:"Finance",
      desc:"Where the first two books set the mindset, this one gets tactical about the I-quadrant specifically: how to think like an investor rather than a saver. Kiyosaki argues that most people are taught to avoid risk entirely, when the real skill is learning to manage and reduce risk through financial education — reading financial statements, understanding how debt can be used productively (leverage) versus destructively (consumer debt), and recognizing that professional investors create their own deals rather than only buying what's already packaged and marketed to the public (mutual funds, index products). It covers real estate, business ownership, and paper assets at a conceptual level, aimed at getting a reader from \u201Ca saver who is scared of losing money\u201D to \u201Can investor who understands what they're buying and why.\u201D" },
    { title:"The Psychology of Money", author:"Morgan Housel", pillar:"Finance",
      desc:"Housel's central claim is that financial outcomes are driven far more by behavior than by intelligence — that a janitor with humility and patience can end up wealthier than a hedge fund manager with neither. Told through nineteen short, story-driven chapters, the book covers ideas like the role of pure luck and risk in outcomes we credit entirely to skill, the compounding power of \u201Cboring\u201D consistency over flashy bets, the danger of comparing your financial life to other people's (the reason \u201Cenough\u201D is a number worth defining for yourself), and why saving matters more for the flexibility and independence it buys than for any specific purchase it funds. It's less a how-to and more a book about temperament — the argument that staying in the game, avoiding catastrophic decisions, and not needing to impress anyone are the real edge most people are missing." },
    { title:"The Personal MBA", author:"Josh Kaufman", pillar:"Finance",
      desc:"Kaufman's pitch is that an actual MBA teaches a small set of durable, cross-industry principles buried under a huge amount of expensive signaling — and that those principles can be learned directly. The book is organized around the mechanics every business shares regardless of industry: creating something of value, marketing it so the right people notice, selling it without being manipulative, delivering on the promise, and managing the finance and systems that keep the whole thing running. It leans on mental models (e.g. the \u201Civeconomics\u201D of iteration, or thinking of a business as a value-creation engine rather than a product) more than jargon, which makes it useful both for someone starting a side business and for someone just trying to understand how their employer actually makes money." },
    { title:"The 10X Rule", author:"Grant Cardone", pillar:"Finance",
      desc:"Cardone's argument is blunt: most people fail not because they aim too high, but because they wildly underestimate both the effort required for real success and the amount of action they're actually capable of. The \u201C10X\u201D framing means setting goals ten times bigger than what feels reasonable and then backing them with ten times the effort you'd normally assume is needed — treating massive, sustained action as the default rather than the exception. It's an intense, high-energy read that works well as a jolt for someone stuck in incrementalism, though it's also the most aggressive book on this list, and its all-gas-no-brakes tone is worth balancing against your own capacity for burnout, not adopted wholesale as a permanent operating mode." },
    { title:"Secrets of the Millionaire Mind", author:"T. Harv Eker", pillar:"Finance",
      desc:"Eker's core idea is the \u201Cmoney blueprint\u201D — a set of largely unconscious beliefs about money, self-worth, and what you deserve, usually absorbed from how your family talked about (or avoided talking about) money in childhood. The book argues these blueprints quietly set a ceiling on what people earn and keep, regardless of their skill or effort, until the beliefs themselves are identified and rewritten. It's structured around a series of contrasting \u201Crich vs. poor\u201D mindset statements (e.g. rich people focus on opportunities, poor people focus on obstacles) meant to surface where your own instincts might be working against you. The framework is useful as a mirror for self-examination; its more sweeping claims about mindset alone determining outcomes are worth holding a little loosely." },
    { title:"How to Win Friends and Influence People", author:"Dale Carnegie", pillar:"Relationships",
      desc:"First published in 1936 and still one of the most-read books on interpersonal skill, Carnegie's central thesis is that the fastest way to get people to like and cooperate with you is to become genuinely interested in them — not to become more interesting yourself. The book is organized into practical, repeatable principles: don't criticize or condemn, give honest and sincere appreciation, remember and use people's names, let the other person feel the idea was theirs, and talk in terms of the other person's interests rather than your own. It reads as old-fashioned in places, but the underlying mechanic — that most people are starved for genuine attention and respond powerfully to anyone who offers it — holds up, and it underpins a large share of what later negotiation and leadership books repackage in more modern language." },
    { title:"Can't Hurt Me", author:"David Goggins", pillar:"Discipline",
      desc:"Part memoir, part training manual, Goggins recounts an early life marked by abuse, poverty, and a severe learning disability, and traces how he rebuilt himself into a Navy SEAL, ultra-endurance athlete, and record-setter through what he calls \u201Cthe 40% rule\u201D — the idea that when your mind tells you you're done, you're typically only at about 40% of your actual capacity. The book pushes callusing the mind through deliberately chosen discomfort (cold, exhaustion, embarrassment) as a way of proving to yourself that you can keep a promise under pressure. It's genuinely intense and has helped a lot of people break through self-imposed ceilings, but it's worth reading with the awareness that Goggins himself has since written about the cost of taking that intensity too far without rest or self-compassion — the discipline is the useful part, not the self-punishment." },
    { title:"The First 20 Hours", author:"Josh Kaufman", pillar:"Discipline",
      desc:"Kaufman tackles a common excuse for never starting — \u201CI don't have 10,000 hours to get good at this\u201D — by pointing out that most people don't want mastery, they want basic, functional competence, which is reachable in roughly 20 hours of focused, deliberately structured practice. The method is four steps: deconstruct the skill into its smallest useful sub-skills, learn just enough to self-correct as you go, remove distractions and barriers to practice, and then practice the specific sub-skills for at least 20 hours before judging whether you're capable. Kaufman demonstrates the method live in the book by learning yoga, programming, and the ukulele from scratch. It's most useful as a tool for getting someone unstuck from \u201Csomeday\u201D and into a defined, non-intimidating starting plan this week." },
    { title:"Never Split the Difference", author:"Chris Voss", pillar:"Strategy",
      desc:"Voss spent decades as the FBI's lead international hostage negotiator before turning the same techniques toward business and everyday negotiation, and the book's throughline is \u201Ctactical empathy\u201D — the idea that people don't make decisions when they feel unheard, so naming and validating the other side's position is what actually opens the door to movement, not pressure or clever arguments. Specific tools include mirroring (repeating the last few words someone said to draw out more), labeling (\u201Cit sounds like...\u201D statements that name an emotion without judgment), calibrated questions (open-ended \u201Chow\u201D and \u201Cwhat\u201D questions that let the other side solve your problem for you), and the deliberate pursuit of a genuine \u201Cthat's right\u201D rather than a grudging \u201Cyes.\u201D It applies well beyond hostage situations — salary negotiations, conflicts with a partner, disagreements with a business partner all draw on the same mechanics." },
    { title:"The 48 Laws of Power", author:"Robert Greene", pillar:"Strategy",
      desc:"Greene draws on centuries of political and court history — Machiavelli, Sun Tzu, the rise and fall of kings, generals, and con artists — to distill 48 recurring patterns in how power has actually been won, held, and lost, each illustrated with historical case studies. Some laws are fairly benign observations about strategy and self-presentation (\u201Cconserve your reputation,\u201D \u201Cknow who you're dealing with\u201D); others are frankly manipulative or ethically costly (\u201Ccrush your enemy totally,\u201D \u201Cuse absence to increase respect and honor\u201D through calculated withholding). The book is best read as a map for recognizing tactics that are used on you and in the rooms you operate in, rather than a personal code — treating every law as something to adopt uncritically tends to produce exactly the kind of cynical operator the book's harsher critics accuse it of creating." },
    { title:"The Art of Seduction", author:"Robert Greene", pillar:"Strategy",
      desc:"A companion to 48 Laws that applies the same historical-pattern method specifically to attraction, charisma, and influence, profiling figures from Cleopatra to Casanova to identify recurring \u201Cseducer\u201D archetypes and the psychological levers they used — creating an aura of mystery, mirroring another person's desires back at them, alternating attention with withdrawal. As with the Laws, this is presented as case-study analysis of historical manipulation more than a literal playbook, and several of its techniques cross into territory that treats other people as targets to be maneuvered rather than as people to be known — worth studying for pattern-recognition and worth being explicitly cautious about applying directly to real relationships." },
    { title:"The Game", author:"Neil Strauss", pillar:"Relationships",
      desc:"A journalist's first-person account of going undercover in the pickup-artist subculture of the early 2000s, following Strauss's own transformation from a self-described awkward writer into \u201CStyle,\u201D a recognized figure within that community. The book's more durable idea — buried under a lot of dated and sometimes cringeworthy tactics — is that social and romantic confidence can be built deliberately through practice, feedback, and pushing past a fear of rejection, rather than being a fixed trait some people are simply born with. Strauss's own arc in the book is notably ambivalent about the community's ethics, and the book is as much a critical, warts-and-all documentary of that world as it is an endorsement of it." },
    { title:"The Mystery Method", author:"Erik \u201CMystery\u201D von Markovik", pillar:"Relationships",
      desc:"Written by the pickup-artist teacher who Strauss profiled in The Game, this is the direct instructional version — a staged framework (attraction, comfort, seduction) breaking social approach down into structured phases with specific conversational techniques for each. It's a useful historical artifact for understanding where a lot of modern pop-psychology dating advice actually originated, but it treats social interaction as a repeatable script to be executed on a target more than as a genuine two-way exchange, which sits in real tension with the presence-and-curiosity approach this advisor otherwise recommends — read it as context for the subculture, not as a manual to follow." },
    { title:"The Rational Male", author:"Rollo Tomassi", pillar:"Relationships",
      desc:"Tomassi's book applies an evolutionary psychology lens to modern dating and relationships, arguing that a lot of relationship dysfunction comes from men not understanding the biological and social dynamics actually driving attraction, and pushing self-reliance and internal validation (not needing external approval, including a partner's, to feel secure) as the foundation for a healthy relationship. It's one of the more debated books on this list — praised by some for naming real dynamics people otherwise dance around, criticized by others for a cynical or overly transactional view of relationships and gender — and it's worth reading with the same critical distance recommended for the Greene books rather than treated as settled fact." }
  ];

You are Mastermind — a standing advisor for a small peer group of men who meet regularly to work on their professional, personal, and general growth. You give direct, grounded, non-generic advice, and you hold a real point of view rather than hedging everything.

You reason from two sources together: the material summarized below, AND your own broad general knowledge — psychology, business practice, health, current events, common sense — the same way you'd draw on anything else you know. This material is a strong core lens, not a cage: use it when it's genuinely the sharpest tool for the question, bring in outside knowledge freely when that serves the person better, and feel free to disagree with a source's take if the situation calls for it. Don't force a citation into every answer just to prove you used the list.

═══ 1. FINANCE — money, business, investing, career ═══
- Wealth is built more by behavior than by intelligence: patience, humility about luck and risk, and living below your means matter more than picking winners (in the spirit of Morgan Housel's "The Psychology of Money").
- The core distinction between assets that put money in your pocket and liabilities that take it out, and thinking in terms of building or acquiring income-generating assets rather than only trading hours for a paycheck (Robert Kiyosaki's "Rich Dad Poor Dad" and its employee / self-employed / business-owner / investor quadrant from "Cashflow Quadrant").

- The practical mechanics of any business — value creation, marketing, sales, finance, and systems — condensed into fundamentals anyone can learn (Josh Kaufman's "The Personal MBA").
- Aggressive goal-setting and relentless, oversized action as one legitimate but intense growth lever — offer it as an option for people who want to move fast, not a universal prescription (Grant Cardone's "The 10X Rule").

═══ 2. DISCIPLINE — habits, mindset, health, fitness, stoicism ═══
- Discipline as a trainable trait, not a fixed one; the idea that the mind gives up before the body does, and that seeking out discomfort on purpose builds capacity for harder things — balanced with the caution that this ethic can tip into self-punishment if not paired with self-compassion and rest (David Goggins' "Can't Hurt Me" and "Never Finished").
- Most skills can reach a useful, functional level in around 20 hours of focused, deliberate practice — useful for pushing someone from "someday" into starting this week (Josh Kaufman's "The First 20 Hours").
- Fitness and health are treated as part of discipline, not vanity — consistency in training, sleep, and diet is the base layer that everything else (confidence, image, energy for work) is built on.

═══ 3. STRATEGY — negotiation, leadership, influence, decision-making ═══
- Tactical empathy: understanding and naming the other side's emotional position before trying to move them, using calibrated open questions instead of pressure (Chris Voss's "Never Split the Difference").
- Awareness of how power, leverage, and influence actually operate in rooms and institutions — treat this as a map for recognizing tactics used on you and choosing consciously how to operate, not as a code to live by; its more manipulative maxims should be flagged as ethically costly rather than adopted outright (Robert Greene's "The 48 Laws of Power" and "The Art of Seduction," held at arm's length as historical/strategic case studies rather than literal playbooks).

═══ 4. RELATIONSHIPS — communication, dating, marriage, boundaries, friendship ═══
- Genuine interest in other people, remembering what matters to them, and making people feel valued as the real foundation of influence and likability (Dale Carnegie's "How to Win Friends and Influence People").
- Secure, non-anxious relating: confidence that doesn't depend on controlling other people's reactions, and comfort with the possibility of rejection.

- Boundaries are stated plainly and held consistently, not implied and resented when crossed; this applies equally to dating, marriage, friendship, and family.

═══ 5. IMAGE — style, fitness, grooming, etiquette, presence, confidence ═══
Core principle: appearance and bearing communicate before a person speaks a word, and they can be trained like any other skill — this is a practical, learnable pillar, not vanity.

STYLE — assessing appearance for a specific situation
- Always orient to the occasion first: office, wedding, date, night out, networking, funeral, dinner, church, interview, conference. Formality, colour, footwear, outerwear, and accessories all follow from the occasion — ask where the person is going before recommending anything, if it isn't already clear.
- Fit beats expensive, always: a poorly-fitted $2,000 suit reads worse than a well-tailored $250 one. Recommend a tailor before recommending a bigger budget.
- Rank order for advice: fit first, then grooming and hygiene, then shoes, then colour coordination, then accessories.
- Timeless staples over trends — a small, well-chosen wardrobe beats a large trendy one: white Oxford shirt, light blue shirt, navy blazer, grey trousers, dark jeans, white trainers, brown brogues, black Oxfords, navy suit, grey suit, camel overcoat, a quality belt, a leather watch.
- Style rules worth repeating: wear clothes that actually fit; keep shoes polished and shirts ironed; own fewer, better pieces rather than more, cheaper ones; match leather colours (belt to shoes); avoid oversized logos; when in doubt, dress one level above the occasion rather than below it.
- Colour and body-type guidance: skin undertone, contrast level, and hair/eye colour inform which palette flatters someone; build/height (slim, athletic, broad, heavy, tall, short) informs which cuts flatter — give this kind of tailored guidance when asked rather than one-size-fits-all rules.
- Fragrance is taught by category, not by specific product recommendation: fresh, woody, oriental/spicy, aquatic — with guidance on which categories suit which season and occasion (lighter/fresher for day and summer, deeper/warmer for evening and winter), and the norm of applying lightly rather than heavily.

GROOMING — non-negotiable, not optional
- Checklist to run through when relevant: hair, facial hair, skin, nails, breath, fragrance, eyebrows, teeth, posture. Small, consistent maintenance beats occasional overhaul.
- Treat grooming as a routine to plan, not a one-off: haircut frequency, skincare, beard maintenance, dental care, and fragrance rotation are all worth setting a cadence for, the same way a workout routine gets one.

ETIQUETTE & PRESENCE
- Practical etiquette covers introductions, handshakes, eye contact, dining, hosting and being a good guest, phone and email manners, networking, and conversation — the through-line is making the other person comfortable, not performing for them.
- Presence is built from posture, voice, unhurried pace, genuine eye contact, and real listening — not from a rehearsed personality.
- Confidence is taught as the output of preparation, competence, consistency, self-respect, and accountability — not as a pose or a trick to fake. Someone who is actually prepared and competent doesn't need to perform confidence.

HOW TO ACTUALLY HELP WITH IMAGE QUESTIONS
- If a member describes going somewhere specific (wedding, interview, date, funeral, etc.) and the details aren't given, ask briefly: indoor or outdoor, season, and dress code — then give a concrete outfit recommendation, not vague guidelines.
- If a member gives their age, height, build, budget, climate, job, and the purpose of the outfit, use all of it to tailor recommendations — this is more useful than generic advice.
- If a member uploads a photo and asks for feedback (an "image audit"), actually look at it and comment specifically on what's visible: fit through the shoulders/chest/waist, sleeve and trouser length, colour harmony, shoe condition, grooming, and posture — concrete and specific, not generic compliments or generic criticism.
- If asked for a "personal image score" or self-assessment, score plainly (e.g. out of 10) across wardrobe, fit, hair, skin, fitness, confidence, etiquette, professionalism, and communication based on what the person has actually told you or shown you — then give specific, prioritized improvements, not just numbers.
- Treat this like a working knowledge base: for any specific garment (Oxford shoes, loafers, Chelsea boots, double-breasted suits, pocket squares, tie bars, watches, belts, overcoats), be able to explain its purpose, roughly when to wear it, and when not to.

═══ 6. LEGACY — purpose, leadership, family, community, mentorship ═══
- Zooming out from the day-to-day: what someone is actually building toward, not just optimizing this week — career and money in service of something, not as the endpoint.
- Leadership and mentorship as a responsibility that grows with success — the "10% of men" framing only means something if it comes with responsibility to others, not just personal gain.
- Family and community as long-horizon investments that don't show returns on the same timeline as a career move, but compound the most over a lifetime — worth naming explicitly when someone is only weighing short-term tradeoffs.

When advising: identify which pillar(s) above are actually relevant to the specific situation, reason using those frameworks by name where it adds credibility, and give concrete, specific next steps rather than platitudes. Where sources disagree or a framework has real downsides (e.g. Goggins' intensity, 10X's aggressiveness, 48 Laws' cynicism), name the tension rather than hiding it.

  const MAX_ATTACHMENT_BYTES = 4 * 1024 * 1024;

  function fileToAttachment(file){
    return new Promise((resolve, reject)=>{
      if(file.size > MAX_ATTACHMENT_BYTES){
        reject(new Error(`${file.name} is over 4MB — try a smaller file.`));
        return;
      }
      const isImage = file.type.startsWith("image/");
      const isPdf = file.type === "application/pdf";
      if(!isImage && !isPdf){
        reject(new Error(`${file.name} isn't an image or PDF.`));
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = reader.result.split(",")[1];
        resolve({ name:file.name, mediaType:file.type, data:base64, kind: isImage ? "image" : "pdf" });
      };
      reader.onerror = () => reject(new Error(`Couldn't read ${file.name}.`));
      reader.readAsDataURL(file);
    });
  }

    try{

      const entryRes = await window.storage.get(STORAGE_ENTRY_PREFIX + matches[0].id, true);

    try{
      await window.storage.set(STORAGE_ENTRY_PREFIX + id, JSON.stringify(entry), true);

      const list = listRes && listRes.value ? JSON.parse(listRes.value) : [];
      const idx = list.findIndex(item=>item.id===id);
      if(idx >= 0) list[idx] = { id, name: entry.name, submittedAt: entry.submittedAt };
      else list.push({ id, name: entry.name, submittedAt: entry.submittedAt });
      await window.storage.set(STORAGE_ROSTER_KEY, JSON.stringify(list), true);
    }catch(e){ console.error(e); }
    return id;
  }

  let jsPDFLoadPromise = null;

      script.onload = ()=>resolve(window.jspdf);
      script.onerror = ()=>reject(new Error("Could not load PDF library"));

  async function downloadOnesheetPdf(){
    state.rt.pdfLoading = true; state.rt.pdfError = null; render();
    try{
      const { jsPDF } = await loadJsPDF();
      const doc = new jsPDF({ unit:"pt", format:"letter" });
      const a = state.rt.advice;
      const marginX = 56;
      const pageWidth = doc.internal.pageSize.getWidth();
      const usableWidth = pageWidth - marginX * 2;
      let y = 64;

      const goldColor = [201, 163, 94];
      const inkColor = [21, 34, 56];
      const dimColor = [110, 122, 145];

      const ensureSpace = (needed)=>{
        const pageHeight = doc.internal.pageSize.getHeight();
        if(y + needed > pageHeight - 56){ doc.addPage(); y = 64; }
      };
      const writeHeading = (text)=>{
        ensureSpace(28);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.setTextColor(...goldColor);
        doc.text(text.toUpperCase(), marginX, y);
        y += 16;
      };
      const writeBody = (text)=>{
        doc.setFont("helvetica", "normal");
        doc.setFontSize(11);
        doc.setTextColor(...inkColor);
        const lines = doc.splitTextToSize(text || "", usableWidth);
        lines.forEach(line=>{
          ensureSpace(16);
          doc.text(line, marginX, y);
          y += 16;
        });
        y += 8;
      };
      const writeBullets = (items)=>{
        doc.setFont("helvetica", "normal");
        doc.setFontSize(11);
        doc.setTextColor(...inkColor);
        items.forEach(item=>{
          const lines = doc.splitTextToSize("•  " + item, usableWidth);
          lines.forEach((line,i)=>{
            ensureSpace(16);
            doc.text(line, marginX, y);
            y += 16;
          });
        });
        y += 8;
      };

      doc.setFont("helvetica", "bold");
      doc.setFontSize(9);
      doc.setTextColor(...dimColor);
      doc.text("MASTERMIND · ROUNDTABLE ONE-SHEET", marginX, y);
      y += 26;
      doc.setFont("times", "bold");
      doc.setFontSize(24);
      doc.setTextColor(...inkColor);
      doc.text(state.rt.name || "Member", marginX, y);
      y += 18;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(10);
      doc.setTextColor(...dimColor);
      doc.text(new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}), marginX, y);
      y += 30;

      writeHeading("Facets in play");
      writeBody((a.facets||[]).join(" · "));
      writeHeading("Blind spot worth naming");
      writeBody(a.blindSpot || "");
      writeHeading("Questions the group should ask");
      writeBullets(a.clarifyingQuestions || []);
      writeHeading("Concrete suggestions");
      writeBullets((a.suggestions||[]).map(s=>s.text + (s.source ? " (" + s.source + ")" : "")));
      if(a.furtherResources && a.furtherResources.length){
        writeHeading("Worth a look");
        writeBullets(a.furtherResources.map(r=>r.title + (r.type ? " [" + r.type + "]" : "") + " — " + r.why));
      }
      writeHeading("Possible commitment");
      writeBody(a.commitmentPrompt || "");

      const safeName = (state.rt.name || "member").trim().toLowerCase().replace(/[^a-z0-9]+/g,'-');
      const blob = doc.output('blob');
      const blobUrl = URL.createObjectURL(blob);
      const dlLink = document.createElement('a');
      dlLink.href = blobUrl;
      dlLink.download = `mastermind-onesheet-${safeName}.pdf`;
      dlLink.style.display = 'none';
      document.body.appendChild(dlLink);
      dlLink.click();
      document.body.removeChild(dlLink);
      setTimeout(()=>URL.revokeObjectURL(blobUrl), 3000);
    }catch(e){
      console.error(e);
      state.rt.pdfError = "Couldn't generate the PDF — try Print instead and save as PDF from there.";
    }
    state.rt.pdfLoading = false;
    render();
  }

  function exportAllOnesheets(){
    if(!state.rt.roster.length) return;
    const sections = state.rt.roster.map(e=>onesheetTextContent(e.name, e.advice || {}));
    const divider = "\n\n" + "═".repeat(50) + "\n\n";
    const combined = `MASTERMIND · ROUNDTABLE — ALL ONE-SHEETS\nExported ${new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}\n${divider}` + sections.join(divider);
    const blob = new Blob([combined], { type:"text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `mastermind-roundtable-all-onesheets-${new Date().toISOString().slice(0,10)}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function forgeClockControlsHtml(){
    const mode = state.forge.clockMode;
    const sw = state.forge.sw, t = state.forge.timer;
    let display, controls;
    if(mode === 'stopwatch'){
      display = formatClock(sw.running ? sw.elapsedMs + (Date.now()-sw.lastStart) : sw.elapsedMs);
      controls = !sw.running && sw.elapsedMs===0
        ? `<button class="ms-btn ms-btn-gold" id="ms-sw-start" style="padding:8px 14px; font-size:11px;">Start</button>`
        : sw.running
          ? `<button class="ms-btn ms-btn-ghost" id="ms-sw-lap" style="padding:8px 14px; font-size:11px;">Lap</button><button class="ms-btn ms-btn-gold" id="ms-sw-stop" style="padding:8px 14px; font-size:11px;">Stop</button>`
          : `<button class="ms-btn ms-btn-gold" id="ms-sw-resume" style="padding:8px 14px; font-size:11px;">Resume</button><button class="ms-btn ms-btn-ghost" id="ms-sw-reset" style="padding:8px 14px; font-size:11px;">Reset</button>`;
      if(sw.laps.length) controls += `<button class="ms-btn ms-btn-ghost" id="ms-sw-laps-toggle" style="padding:8px 14px; font-size:11px;">Laps (${sw.laps.length})</button>`;
    } else {
      const notStarted = !t.running && t.totalMs===0 && !t.done;
      display = formatClock(t.running ? t.remainingMs : t.remainingMs);
      controls = notStarted
        ? `<input type="number" min="0" id="ms-timer-min" value="${esc(t.inputMinutes)}" placeholder="min" class="ms-input" style="width:64px; padding:7px;"/><input type="number" min="0" max="59" id="ms-timer-sec" value="${esc(t.inputSeconds)}" placeholder="sec" class="ms-input" style="width:64px; padding:7px;"/><button class="ms-btn ms-btn-gold" id="ms-timer-start" style="padding:8px 14px; font-size:11px;">Start</button>`
        : t.done
          ? `<span style="color:var(--gold-bright); font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.05em;">TIME'S UP</span><button class="ms-btn ms-btn-ghost" id="ms-timer-cancel" style="padding:8px 14px; font-size:11px;">Reset</button>`
          : t.running
            ? `<button class="ms-btn ms-btn-gold" id="ms-timer-pause" style="padding:8px 14px; font-size:11px;">Pause</button><button class="ms-btn ms-btn-ghost" id="ms-timer-cancel" style="padding:8px 14px; font-size:11px;">Cancel</button>`
            : `<button class="ms-btn ms-btn-gold" id="ms-timer-resume" style="padding:8px 14px; font-size:11px;">Resume</button><button class="ms-btn ms-btn-ghost" id="ms-timer-cancel" style="padding:8px 14px; font-size:11px;">Cancel</button>`;
    }
    return `

        <div class="ms-forge-mode-toggle">
          <button class="ms-forge-mode-btn ${mode==='stopwatch'?'ms-active':''}" id="ms-forge-mode-sw" title="Stopwatch">⏱</button>

        </div>
        <span id="ms-forge-clock-display" class="ms-forge-clock-display">${esc(display)}</span>
        <div class="ms-forge-clock-controls" style="position:relative;">
          ${controls}
          ${(mode==='stopwatch' && state.forge.showLaps && sw.laps.length) ? `
            <div class="ms-forge-laps-panel">

        </div>
      </div>

  // ---------- Member profiles ----------
  async function loadProfile(){
    try{
      const res = await window.storage.get(PROFILE_KEY, false);
      if(res && res.value) state.profile = JSON.parse(res.value);
    }catch(e){ state.profile = null; }
  }

  async function syncProfileToSharedList(profile, attempts){
    attempts = attempts || 3;
    let lastErr = null;
    for(let i=0; i<attempts; i++){
      try{
        const listRes = await window.storage.get(PROFILES_LIST_KEY, true).catch(()=>null);
        const list = listRes && listRes.value ? JSON.parse(listRes.value) : [];
        const idx = list.findIndex(p=>p.id===profile.id);
        if(idx>=0) list[idx] = profile; else list.push(profile);
        await window.storage.set(PROFILES_LIST_KEY, JSON.stringify(list), true);
        return true;
      }catch(e){
        lastErr = e;
        if(i < attempts-1) await new Promise(r=>setTimeout(r, 600 * (i+1)));
      }
    }
    console.error("Couldn't sync profile to shared roster after retries:", lastErr);
    return false;
  }

  async function saveProfile(name, colorKey){
    const profile = { id: name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-'), name: name.trim(), color: colorKey, createdAt: Date.now() };
    state.profile = profile; // let them in right away — persistence below is best-effort, never a gate to entry
    try{
      await window.storage.set(PROFILE_KEY, JSON.stringify(profile), false);
    }catch(e){ console.error("Couldn't save profile locally:", e); }
    state.profileSyncOk = await syncProfileToSharedList(profile);
    return profile;
  }

  async function updateProfile(name, colorKey){
    const profile = { id: state.profile.id, name: name.trim(), color: colorKey, createdAt: state.profile.createdAt || Date.now() };
    state.profile = profile; // apply locally right away, same resilience as saveProfile
    try{
      await window.storage.set(PROFILE_KEY, JSON.stringify(profile), false);
    }catch(e){ console.error("Couldn't save profile locally:", e); }
    state.profileSyncOk = await syncProfileToSharedList(profile);

  function colorHex(key){
    if(/^#[0-9a-f]{6}$/i.test(key||"")) return key;

  // ---------- Goals & check-ins (progress) ----------
  // Shape stored at PROGRESS_PREFIX + profileId (shared):
  // { profileId, name, color, goals: [ { id, kind:'long'|'short', title, parentId, metricName, metricUnit, targetValue, currentValue, deadline, done, createdAt } ],
  //   checkins: [ { id, at, note, summary, onTrackShort, onTrackLong } ] }

  function emptyProgress(profile){
    return { profileId: profile.id, name: profile.name, color: profile.color, goals: [], checkins: [] };
  }

  async function loadMyProgress(){
    if(!state.profile) return emptyProgress({ id:"", name:"", color:"sky" });
    try{
      const res = await window.storage.get(PROGRESS_PREFIX + state.profile.id, true);
      if(res && res.value) return JSON.parse(res.value);
    }catch(e){ /* none yet */ }
    return emptyProgress(state.profile);
  }

  async function saveMyProgress(progress){
    progress.name = state.profile.name;
    progress.color = state.profile.color;
    await window.storage.set(PROGRESS_PREFIX + state.profile.id, JSON.stringify(progress), true);
  }

  function goalProgressPct(goal, allGoals){
    if(goal.kind === 'short'){
      const t = parseFloat(goal.targetValue), c = parseFloat(goal.currentValue);
      if(goal.done) return 100;
      if(!isFinite(t) || t<=0 || !isFinite(c)) return 0;
      return Math.max(0, Math.min(100, Math.round((c/t)*100)));
    }
    // long-term: average of children's pct, or done flag
    const children = allGoals.filter(g=>g.parentId===goal.id);
    if(!children.length) return goal.done ? 100 : 0;
    const sum = children.reduce((acc,c)=>acc+goalProgressPct(c, allGoals),0);
    return Math.round(sum/children.length);
  }

  function checkinStreak(checkins){
    if(!checkins || !checkins.length) return 0;
    const sorted = [...checkins].sort((a,b)=>b.at-a.at);
    let streak = 0;
    let cursor = Date.now();
    for(const c of sorted){
      const gapDays = (cursor - c.at) / (1000*60*60*24);
      if(gapDays <= 9){ streak++; cursor = c.at; } else break;
    }
    return streak;
  }

  async function loadDashboard(){
    state.dash.loading = true; state.dash.error = null; render();
    try{
      const listRes = await window.storage.get(PROFILES_LIST_KEY, true).catch(()=>null);
      const list = listRes && listRes.value ? JSON.parse(listRes.value) : [];
      const members = [];
      for(const p of list){
        try{
          const res = await window.storage.get(PROGRESS_PREFIX + p.id, true);
          const progress = res && res.value ? JSON.parse(res.value) : emptyProgress(p);
          members.push({ profile:p, progress });
        }catch(e){
          members.push({ profile:p, progress: emptyProgress(p) });
        }
      }
      members.sort((a,b)=>{
        const lastA = a.progress.checkins.length ? Math.max(...a.progress.checkins.map(c=>c.at)) : 0;
        const lastB = b.progress.checkins.length ? Math.max(...b.progress.checkins.map(c=>c.at)) : 0;
        return lastB - lastA;
      });
      state.dash.members = members;
    }catch(e){
      console.error(e);
      state.dash.error = "Couldn't load the dashboard right now.";
    }
    state.dash.loading = false; render();
  }

  // ---------- One-sheet PDF uploads ----------
  function base64ToBlobUrl(base64, mediaType){
    try{
      const byteChars = atob(base64);
      const byteNumbers = new Array(byteChars.length);
      for(let i=0;i<byteChars.length;i++) byteNumbers[i] = byteChars.charCodeAt(i);
      const byteArray = new Uint8Array(byteNumbers);
      const blob = new Blob([byteArray], { type: mediaType || 'application/pdf' });
      return URL.createObjectURL(blob);
    }catch(e){ console.error(e); return null; }
  }

  async function loadPdfIndex(){
    try{
      const res = await window.storage.get(PDF_INDEX_KEY, true);
      if(res && res.value) return JSON.parse(res.value);
    }catch(e){ /* none yet */ }
    return [];
  }

  async function uploadOnesheetPdf(entryId, file){
    if(!isPdfFile(file)){ throw new Error("That doesn't look like a PDF."); }
    if(file.size > MAX_PDF_BYTES){ throw new Error("That PDF is too big — keep it under 3.5MB."); }
    const base64 = await new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result.split(",")[1]);
      reader.onerror = ()=>reject(new Error("Couldn't read that file."));
      reader.readAsDataURL(file);
    });
    await window.storage.set(PDF_PREFIX + entryId, JSON.stringify({ name:file.name, mediaType:"application/pdf", data:base64 }), true);
    const index = await loadPdfIndex();
    if(!index.includes(entryId)){
      index.push(entryId);
      await window.storage.set(PDF_INDEX_KEY, JSON.stringify(index), true);
    }
  }

  async function loadProfilePdfForEntry(entryId){
    state.forge.profilePdf = null; state.forge.profilePdfError = null;
    if(!entryId) return;
    state.forge.profilePdfLoading = true; render();
    try{
      const res = await window.storage.get(PDF_PREFIX + entryId, true);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        const objectUrl = base64ToBlobUrl(parsed.data, parsed.mediaType);
        state.forge.profilePdf = { name: parsed.name, objectUrl };
        if(!state.forge.manualPdf) state.forge.activeSource = 'profile';
      } else {
        state.forge.profilePdf = null;
      }
    }catch(e){
      state.forge.profilePdf = null;
    }
    state.forge.profilePdfLoading = false; render();
  }

  // ---------- The Forge: people list (profiles + roster, merged) ----------
  async function loadForgePeople(){
    state.forge.peopleLoading = true; render();
    try{
      if(!state.rt.roster.length && !state.rt.rosterLoading) await loadRoster();
      const profRes = await window.storage.get(PROFILES_LIST_KEY, true).catch(()=>null);
      const profiles = profRes && profRes.value ? JSON.parse(profRes.value) : [];
      const roster = state.rt.roster || [];
      const byName = {};
      roster.forEach(e=>{ byName[e.name.trim().toLowerCase()] = e; });
      const seen = new Set();
      const list = [];
      profiles.forEach(p=>{
        const key = p.name.trim().toLowerCase();
        seen.add(key);
        const match = byName[key];
        list.push({ name:p.name, entryId: match ? match.id : null, hasPdf: match ? !!match.hasPdf : false, color:p.color });
      });
      roster.forEach(e=>{
        const key = e.name.trim().toLowerCase();
        if(!seen.has(key)){
          seen.add(key);
          list.push({ name:e.name, entryId:e.id, hasPdf:!!e.hasPdf, color:null });
        }
      });
      list.sort((a,b)=>a.name.localeCompare(b.name));
      state.forge.people = list;
    }catch(e){
      state.forge.people = [];
    }
    state.forge.peopleLoading = false; render();
  }

  // ---------- The Forge: PDF upload + source selection (native browser rendering, no external deps) ----------
  function forgeManualUpload(file){
    if(!isPdfFile(file)){ state.forge.uploadError = "That doesn't look like a PDF."; render(); return; }
    if(state.forge.manualPdf && state.forge.manualPdf.objectUrl) URL.revokeObjectURL(state.forge.manualPdf.objectUrl);
    const objectUrl = URL.createObjectURL(file);
    state.forge.manualPdf = { name:file.name, objectUrl };
    state.forge.activeSource = 'manual';
    state.forge.uploadError = null;
    render();
  }
  function forgeRemoveManualPdf(){
    if(state.forge.manualPdf && state.forge.manualPdf.objectUrl) URL.revokeObjectURL(state.forge.manualPdf.objectUrl);
    state.forge.manualPdf = null;
    state.forge.activeSource = state.forge.profilePdf ? 'profile' : null;
    render();
  }
  function forgeSetSource(source){
    state.forge.activeSource = source;
    render();
  }
  function forgeActivePdf(){
    const f = state.forge;
    if(f.profilePdf && f.manualPdf){
      return f.activeSource === 'manual' ? f.manualPdf : f.profilePdf;
    }
    return f.manualPdf || f.profilePdf || null;
  }

  // ---------- The Forge: clock ----------
  let forgeTickInterval = null;
  function formatClock(ms){
    ms = Math.max(0, ms);
    const totalSec = Math.floor(ms/1000);
    const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
    const pad = n=>String(n).padStart(2,'0');
    return h>0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  }
  function startForgeTicker(){
    if(forgeTickInterval) return;
    forgeTickInterval = setInterval(()=>{
      const el = document.getElementById('ms-forge-clock-display');
      if(!el) return;
      if(state.forge.clockMode === 'stopwatch'){
        const sw = state.forge.sw;
        const elapsed = sw.running ? (sw.elapsedMs + (Date.now()-sw.lastStart)) : sw.elapsedMs;
        el.textContent = formatClock(elapsed);
      } else {
        const t = state.forge.timer;
        if(t.running){
          const remaining = Math.max(0, t.remainingMs - (Date.now()-t.lastTick));
          el.textContent = formatClock(remaining);
          if(remaining<=0 && !t.done){
            t.done = true; t.running = false; t.remainingMs = 0;
            render();
          }
        } else {
          el.textContent = formatClock(t.remainingMs);
        }
      }
    }, 250);
  }
  function stopForgeTicker(){ if(forgeTickInterval){ clearInterval(forgeTickInterval); forgeTickInterval = null; } }

  function forgeSwStart(){ const sw=state.forge.sw; sw.running=true; sw.lastStart=Date.now(); render(); }
  function forgeSwLap(){ const sw=state.forge.sw; if(!sw.running) return; const elapsed = sw.elapsedMs+(Date.now()-sw.lastStart); sw.laps.unshift(elapsed); render(); }
  function forgeSwStop(){ const sw=state.forge.sw; if(sw.running){ sw.elapsedMs += Date.now()-sw.lastStart; sw.running=false; sw.lastStart=null; } render(); }
  function forgeSwResume(){ const sw=state.forge.sw; sw.running=true; sw.lastStart=Date.now(); render(); }
  function forgeSwReset(){ state.forge.sw = { running:false, elapsedMs:0, lastStart:null, laps:[] }; render(); }

  function forgeTimerStart(){
    const t = state.forge.timer;
    const mins = parseInt(t.inputMinutes,10)||0, secs = parseInt(t.inputSeconds,10)||0;
    const totalMs = (mins*60 + secs) * 1000;
    if(totalMs<=0){ state.forge.timerError = "Set a duration first."; render(); return; }
    state.forge.timerError = null;
    t.totalMs = totalMs; t.remainingMs = totalMs; t.running = true; t.lastTick = Date.now(); t.done = false;
    render();
  }
  function forgeTimerPause(){ const t=state.forge.timer; if(t.running){ t.remainingMs = Math.max(0, t.remainingMs-(Date.now()-t.lastTick)); t.running=false; } render(); }
  function forgeTimerResume(){ const t=state.forge.timer; t.running=true; t.lastTick=Date.now(); render(); }
  function forgeTimerCancel(){ state.forge.timer = { running:false, remainingMs:0, totalMs:0, lastTick:null, inputMinutes:"5", inputSeconds:"0", done:false }; render(); }

  // Explicit pixel sizing for the PDF iframe — belt-and-suspenders against any
  // flexbox percentage-height quirk in this nested/embedded environment.
  function sizeForgePdfFrame(){
    const frame = document.getElementById('ms-forge-pdf-frame');
    const area = document.getElementById('ms-forge-pdf-area');
    if(!frame || !area) return;
    const h = area.clientHeight;
    if(h > 0) frame.style.height = h + 'px';
  }

  function toggleForgeFullscreen(){
    const el = document.getElementById('ms-forge-viewer');
    if(!el) return;
    if(state.forge.pseudoFullscreen){
      state.forge.pseudoFullscreen = false;
      render();
      return;
    }
    if(document.fullscreenElement || document.webkitFullscreenElement){
      try{ (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document); }catch(e){}
      return;
    }
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(req){
      try{
        const result = req.call(el);
        if(result && typeof result.catch === 'function'){
          result.catch(()=>{ state.forge.pseudoFullscreen = true; render(); });
        }
      }catch(e){
        state.forge.pseudoFullscreen = true;
        render();
      }
    } else {
      state.forge.pseudoFullscreen = true;
      render();
    }
  }

  function newGoalId(){ return 'g' + Date.now() + Math.random().toString(36).slice(2,7); }

  async function submitGoalForm(){
    const f = state.dash.goalForm;
    if(!f.title.trim()){ state.dash.goalFormError = "Give the goal a title."; render(); return; }
    if(f.kind === 'short' && !f.metricName.trim()){ state.dash.goalFormError = "Add what you're measuring."; render(); return; }
    state.dash.goalFormError = null;
    const progress = await loadMyProgress();
    if(f.editingId){
      const g = progress.goals.find(g=>g.id===f.editingId);
      if(g){
        g.title = f.title.trim();
        g.metricName = f.metricName.trim();
        g.metricUnit = f.metricUnit.trim();
        g.targetValue = f.targetValue;
        g.deadline = f.deadline;
        g.visibility = f.visibility === 'private' ? 'private' : 'public';
      }
    } else {
      progress.goals.push({
        id: newGoalId(), kind: f.kind, title: f.title.trim(), parentId: f.parentId || null,
        metricName: f.metricName.trim(), metricUnit: f.metricUnit.trim(),
        targetValue: f.targetValue, currentValue: 0, deadline: f.deadline, done:false, createdAt: Date.now(),
        visibility: f.visibility === 'private' ? 'private' : 'public'
      });
    }
    await saveMyProgress(progress);
    state.dash.goalForm = null;
    await loadDashboard();
  }

  async function updateGoalValue(goalId, newValue){
    const progress = await loadMyProgress();
    const g = progress.goals.find(g=>g.id===goalId);
    if(!g) return;
    g.currentValue = newValue;
    const t = parseFloat(g.targetValue);
    if(isFinite(t) && parseFloat(newValue) >= t) g.done = true;
    await saveMyProgress(progress);
    await loadDashboard();
  }

  async function toggleGoalDone(goalId){
    const progress = await loadMyProgress();
    const g = progress.goals.find(g=>g.id===goalId);
    if(!g) return;
    g.done = !g.done;
    await saveMyProgress(progress);
    await loadDashboard();
  }

  async function deleteGoal(goalId){
    const progress = await loadMyProgress();
    progress.goals = progress.goals.filter(g=>g.id!==goalId && g.parentId!==goalId);
    await saveMyProgress(progress);
    await loadDashboard();
  }

  async function submitCheckin(){
    const f = state.dash.checkinForm;
    if(!f.text.trim()){ f.error = "Tell Mastermind how the week went first."; render(); return; }
    f.loading = true; f.error = null; render();
    try{
      const progress = await loadMyProgress();
      const goalSummary = progress.goals.map(g=>{
        const pct = goalProgressPct(g, progress.goals);
        return `${g.kind==='long'?'[Long-term]':'[Short-term]'} ${g.title}${g.metricName?` — ${g.metricName}: ${g.currentValue||0}/${g.targetValue||'?'}${g.metricUnit?' '+g.metricUnit:''}`:''} (${pct}% there, ${g.done?'marked done':'in progress'})`;
      }).join("\n") || "(No goals set up yet.)";
      const sys = `Give a short weekly check-in reflection for this member, based on their goals and what they reported about the week. Respond ONLY with JSON, no markdown fences, in exactly this shape:
{ "summary": "2-3 sentence direct, honest read on how the week went, referencing specifics they mentioned", "onTrackShort": "one short sentence on whether they look on track for their short-term goals and why", "onTrackLong": "one short sentence on whether the week's pace supports their long-term goal(s) and why", "nudge": "one sentence of direct encouragement or a direct challenge for next week — whichever the situation calls for" }`;
      const userText = `Member: ${state.profile.name}\n\nCurrent goals:\n${goalSummary}\n\nThis week's update from the member:\n${f.text.trim()}`;
      const text = await callMentor(sys, userText, 500);
      const result = parseJson(text);
      progress.checkins.push({ id:'c'+Date.now(), at: Date.now(), note: f.text.trim(), ...result });
      await saveMyProgress(progress);
      state.dash.checkinForm = null;
      await loadDashboard();
    }catch(e){
      console.error(e);
      f.error = "Couldn't reach Mastermind for the check-in — try again in a moment.";
      f.loading = false;
      render();
    }
  }

  // ---------- Master render ----------
  async function render(){
    const navEl = document.getElementById("ms-nav");

    if(!state.unlocked){
      if(navEl) navEl.style.display = "none";
      app.innerHTML = renderGate();
      bindGateEvents();
      return;
    }
    if(state.showProfileSetup || (!state.profile && !state.skippedProfile)){
      if(navEl) navEl.style.display = "none";
      app.innerHTML = renderProfileSetup();
      bindProfileSetupEvents();
      return;
    }
    if(navEl) navEl.style.display = "";

    document.querySelectorAll(".ms-tab-btn").forEach(b=>{
      b.classList.toggle("ms-active", b.dataset.tab === state.tab);
    });
    const rootEl = document.getElementById("ms-root");
    if(rootEl){
      rootEl.classList.toggle("ms-theme-home", state.tab === "home");
      rootEl.classList.toggle("ms-theme-roundtable", state.tab === "roundtable");
      rootEl.classList.toggle("ms-theme-about", state.tab === "about");
      rootEl.classList.toggle("ms-dark", state.darkMode);
    }
    const darkToggleBtn = document.getElementById("ms-dark-toggle");
    if(darkToggleBtn) darkToggleBtn.textContent = state.darkMode ? "☀️" : "🌙";
    const profileNavBtn = document.getElementById("ms-profile-nav-btn");
    if(profileNavBtn) profileNavBtn.style.display = state.profile ? "none" : "";

    if(state.tab === "roundtable" && state.rt.view === "forge"){
      startForgeTicker();
    } else {
      stopForgeTicker();
    }

    if(state.tab === "home"){
      app.innerHTML = renderHome();
      bindHomeEvents();
    } else if(state.tab === "roundtable"){
      if(state.rt.view === "form"){
        app.innerHTML = renderRtForm(); bindRtFormEvents();
      }
      else if(state.rt.view === "dashboard"){
        app.innerHTML = renderRtDashboard(); bindRtDashboardEvents();
        if(!state.dash.members.length && !state.dash.loading) loadDashboard();
      }
      else if(state.rt.view === "forge"){
        app.innerHTML = renderRtForge(); bindRtForgeEvents();
        if(!state.forge.people.length && !state.forge.peopleLoading) loadForgePeople();
      }
      else if(state.rt.view === "loading"){ app.innerHTML = renderRtLoading(); }
      else if(state.rt.view === "preview"){ app.innerHTML = renderRtPreview(); bindRtPreviewEvents(); }
      else if(state.rt.view === "roster"){ app.innerHTML = renderRtRoster(); bindRtRosterEvents(); }
    } else if(state.tab === "about"){
      app.innerHTML = renderAbout();
      bindAboutEvents();
    }
  }

  function bindGateEvents(){
    const input = document.getElementById("ms-gate-input");
    const submit = document.getElementById("ms-gate-submit");
    const tryUnlock = ()=>{
      if(state.passInput === SITE_PASSCODE){
        state.unlocked = true;
        state.passError = false;
        window.storage.set(UNLOCK_STORAGE_KEY, "true", false).catch(()=>{});
        render();
      } else {
        state.passError = true;
        render();
      }
    };
    if(input){
      input.addEventListener("input", e=>{ state.passInput = e.target.value; });
      input.addEventListener("keydown", e=>{ if(e.key === "Enter") tryUnlock(); });
      input.focus();
    }
    if(submit) submit.addEventListener("click", tryUnlock);
  }

  function bindProfileSetupEvents(){
    const nameInput = document.getElementById("ms-profile-name");
    if(nameInput){
      nameInput.addEventListener("input", e=>{ state.profileSetup.name = e.target.value; });
      nameInput.focus();
    }
    document.querySelectorAll(".ms-color-swatch[data-color]").forEach(el=>{
      el.addEventListener("click", ()=>{ state.profileSetup.color = el.dataset.color; render(); });
    });
    const customColorInput = document.getElementById("ms-profile-custom-color");
    if(customColorInput) customColorInput.addEventListener("input", e=>{ state.profileSetup.color = e.target.value; render(); });
    const customHexInput = document.getElementById("ms-profile-custom-hex");
    if(customHexInput) customHexInput.addEventListener("input", e=>{
      let v = e.target.value.trim();
      if(v && v[0] !== '#') v = '#' + v;
      state.profileSetup.color = v;
      if(/^#[0-9a-f]{6}$/i.test(v)){
        const swatchPreview = document.getElementById("ms-profile-custom-color");
        if(swatchPreview) swatchPreview.value = v;
      }
    });
    const saveBtn = document.getElementById("ms-profile-save");
    if(saveBtn) saveBtn.addEventListener("click", async ()=>{
      if(state.profileSetup.saving) return;
      if(!state.profileSetup.name.trim()){ state.profileSetup.error = "Add your name first."; render(); return; }
      state.profileSetup.saving = true; state.profileSetup.error = null; render();
      try{
        await withTimeout(saveProfile(state.profileSetup.name, state.profileSetup.color));
        await withTimeout(loadChatHistory()).catch(()=>{});
      }catch(e){
        console.error(e);
        state.profileSetup.saving = false;
        state.profileSetup.error = e.message || "Couldn't save your profile — check your connection and try again.";
        render();
        return;
      }
      state.profileSetup.saving = false;
      render();
    });
    const skipBtn = document.getElementById("ms-profile-skip");
    if(skipBtn) skipBtn.addEventListener("click", ()=>{
      state.skippedProfile = true;
      state.showProfileSetup = false;
      state.profileSetup.error = null;
      render();
    });
