    });
    const openShort = document.getElementById("ms-add-short-goal");
    if(openShort) openShort.addEventListener("click", ()=>{
      state.dash.goalForm = { kind:'short', parentId:null, title:"", metricName:"", metricUnit:"", targetValue:"", deadline:"", editingId:null, visibility:'public' };
      state.dash.checkinForm = null;
      render();
    });
    const openCheckin = document.getElementById("ms-open-checkin");
    if(openCheckin) openCheckin.addEventListener("click", ()=>{
      state.dash.checkinForm = { text:"", loading:false, error:null };
      state.dash.goalForm = null;
      render();
    });
    document.querySelectorAll(".ms-goal-add-child[data-goal-id]").forEach(el=>{
      el.addEventListener("click", ()=>{
        state.dash.goalForm = { kind:'short', parentId: el.dataset.goalId, title:"", metricName:"", metricUnit:"", targetValue:"", deadline:"", editingId:null, visibility:'public' };
        render();
      });
    });
    document.querySelectorAll(".ms-goal-toggle-done[data-goal-id]").forEach(el=>{
      el.addEventListener("click", ()=>toggleGoalDone(el.dataset.goalId));
    });
    document.querySelectorAll(".ms-goal-edit[data-goal-id]").forEach(el=>{
      el.addEventListener("click", async ()=>{
        const progress = await loadMyProgress();
        const g = progress.goals.find(g=>g.id===el.dataset.goalId);
        if(!g) return;
        state.dash.goalForm = {
          kind: g.kind, parentId: g.parentId || null, title: g.title,
          metricName: g.metricName || "", metricUnit: g.metricUnit || "",
          targetValue: g.targetValue || "", deadline: g.deadline || "", editingId: g.id,
          visibility: g.visibility === 'private' ? 'private' : 'public'
        };
        state.dash.checkinForm = null;
        state.dash.profileForm = null;
        render();
      });
    });
    const editProfileBtn = document.getElementById("ms-edit-profile");
    if(editProfileBtn) editProfileBtn.addEventListener("click", ()=>{
      state.dash.profileForm = { name: state.profile.name, color: state.profile.color, error:null };
      state.dash.goalForm = null;
      state.dash.checkinForm = null;
      render();
    });
    document.querySelectorAll(".ms-goal-delete[data-goal-id]").forEach(el=>{
      el.addEventListener("click", ()=>{ if(confirm("Remove this goal?")) deleteGoal(el.dataset.goalId); });
    });
    document.querySelectorAll(".ms-goal-value-save[data-goal-id]").forEach(el=>{
      el.addEventListener("click", ()=>{
        const input = document.querySelector(`.ms-goal-value-input[data-goal-id="${el.dataset.goalId}"]`);
        if(input) updateGoalValue(el.dataset.goalId, input.value);
      });
    });
    const titleInput = document.getElementById("ms-goal-title");
    if(titleInput){
      titleInput.addEventListener("input", e=>{ state.dash.goalForm.title = e.target.value; });
      titleInput.focus();
    }
    const metricNameInput = document.getElementById("ms-goal-metric-name");
    if(metricNameInput) metricNameInput.addEventListener("input", e=>{ state.dash.goalForm.metricName = e.target.value; });
    const metricUnitInput = document.getElementById("ms-goal-metric-unit");
    if(metricUnitInput) metricUnitInput.addEventListener("input", e=>{ state.dash.goalForm.metricUnit = e.target.value; });
    const targetInput = document.getElementById("ms-goal-target");
    if(targetInput) targetInput.addEventListener("input", e=>{ state.dash.goalForm.targetValue = e.target.value; });
    const deadlineInput = document.getElementById("ms-goal-deadline");
    if(deadlineInput) deadlineInput.addEventListener("input", e=>{ state.dash.goalForm.deadline = e.target.value; });
    document.querySelectorAll('input[name="ms-goal-visibility"]').forEach(el=>{
      el.addEventListener("change", e=>{ if(state.dash.goalForm){ state.dash.goalForm.visibility = e.target.value; render(); } });
    });
    const saveGoalBtn = document.getElementById("ms-goal-form-save");
    if(saveGoalBtn) saveGoalBtn.addEventListener("click", submitGoalForm);
    const cancelGoalBtn = document.getElementById("ms-goal-form-cancel");
    if(cancelGoalBtn) cancelGoalBtn.addEventListener("click", ()=>{ state.dash.goalForm = null; render(); });

    const checkinText = document.getElementById("ms-checkin-text");
    if(checkinText){
      checkinText.addEventListener("input", e=>{ state.dash.checkinForm.text = e.target.value; });
      checkinText.focus();
    }
    const checkinSubmit = document.getElementById("ms-checkin-submit");
    if(checkinSubmit) checkinSubmit.addEventListener("click", submitCheckin);
    const checkinCancel = document.getElementById("ms-checkin-cancel");
    if(checkinCancel) checkinCancel.addEventListener("click", ()=>{ state.dash.checkinForm = null; render(); });

    const profileEditName = document.getElementById("ms-profile-edit-name");
    if(profileEditName){
      profileEditName.addEventListener("input", e=>{ state.dash.profileForm.name = e.target.value; });
      profileEditName.focus();
    }
    document.querySelectorAll(".ms-color-swatch[data-color]").forEach(el=>{
      el.addEventListener("click", ()=>{
        if(state.dash.profileForm){ state.dash.profileForm.color = el.dataset.color; render(); }
      });
    });
    const editCustomColorInput = document.getElementById("ms-profile-edit-custom-color");
    if(editCustomColorInput) editCustomColorInput.addEventListener("input", e=>{
      if(state.dash.profileForm){ state.dash.profileForm.color = e.target.value; render(); }
    });
    const editCustomHexInput = document.getElementById("ms-profile-edit-hex");
    if(editCustomHexInput) editCustomHexInput.addEventListener("input", e=>{
      let v = e.target.value.trim();
      if(v && v[0] !== '#') v = '#' + v;
      if(state.dash.profileForm){
        state.dash.profileForm.color = v;
        if(/^#[0-9a-f]{6}$/i.test(v)){
          const swatchPreview = document.getElementById("ms-profile-edit-custom-color");
          if(swatchPreview) swatchPreview.value = v;
        }
      }
    });
    const profileEditSave = document.getElementById("ms-profile-edit-save");
    if(profileEditSave) profileEditSave.addEventListener("click", async ()=>{
      const f = state.dash.profileForm;
      if(f.saving) return;
      if(!f.name.trim()){ f.error = "Add your name first."; render(); return; }
      f.saving = true; f.error = null; render();
      try{
        await withTimeout(updateProfile(f.name, f.color));
        state.dash.profileForm = null;
        await withTimeout(loadDashboard()).catch(()=>{});
      }catch(e){
        console.error(e);
        f.saving = false;
        f.error = e.message || "Couldn't save — check your connection and try again.";
        render();
      }
    });
    const profileEditCancel = document.getElementById("ms-profile-edit-cancel");
    if(profileEditCancel) profileEditCancel.addEventListener("click", ()=>{ state.dash.profileForm = null; render(); });
  }

  function bindHomeEvents(){
    const retrySyncBtn = document.getElementById("ms-retry-profile-sync");
    if(retrySyncBtn) retrySyncBtn.addEventListener("click", retryProfileSync);

    const input = document.getElementById("ms-chat-input");
    if(input){
      input.addEventListener("input", e=>{ state.chat.input = e.target.value; });
      input.addEventListener("keydown", e=>{
        if(e.key === "Enter" && !e.shiftKey){
          e.preventDefault();
          sendChatMessage();
        }
      });
    }
    const btn = document.getElementById("ms-chat-send");
    if(btn) btn.addEventListener("click", sendChatMessage);
    const resetBtn = document.getElementById("ms-chat-reset");
    if(resetBtn) resetBtn.addEventListener("click", ()=>{ stopSpeaking(); resetChat(); });
    document.querySelectorAll(".ms-speak-btn[data-speak-id]").forEach(el=>{
      el.addEventListener("click", ()=>{ toggleSpeak(el.dataset.speakText, el.dataset.speakId); });
    });
    const attachBtn = document.getElementById("ms-chat-attach");
    const micBtn = document.getElementById("ms-chat-mic");
    if(micBtn) micBtn.addEventListener("click", toggleListening);
    const fileInput = document.getElementById("ms-chat-file");
    if(attachBtn && fileInput){
      attachBtn.addEventListener("click", ()=>fileInput.click());
      fileInput.addEventListener("change", (e)=>{
        handleFilesSelected(e.target.files);
        fileInput.value = "";
      });
    }
    document.querySelectorAll(".ms-attach-remove[data-remove-idx]").forEach(el=>{
      el.addEventListener("click", ()=>removePendingFile(parseInt(el.dataset.removeIdx,10)));
    });
    document.querySelectorAll(".ms-quick-chip[data-quick-idx]").forEach(el=>{
      el.addEventListener("click", ()=>{
        const q = QUICK_PROMPTS[parseInt(el.dataset.quickIdx,10)];
        state.chat.input = q.text;
        render();
        const ta = document.getElementById("ms-chat-input");
        if(ta) ta.focus();
        if(q.needsPhoto){
          const fi = document.getElementById("ms-chat-file");
          if(fi) fi.click();
        }
      });
    });
    scrollThreadToBottom();
  }

  function bindRtFormEvents(){
    const dashboardBtn = document.getElementById("ms-rt-dashboard");
    if(dashboardBtn) dashboardBtn.addEventListener("click", ()=>{ state.rt.view="dashboard"; render(); loadDashboard(); });
    const rosterTopBtn = document.getElementById("ms-rt-roster-top");
    if(rosterTopBtn) rosterTopBtn.addEventListener("click", ()=>{ state.rt.view="roster"; loadRoster(); });
    const forgeBtn = document.getElementById("ms-rt-forge");
    if(forgeBtn) forgeBtn.addEventListener("click", ()=>{
      state.rt.view="forge"; render();
      loadForgePeople();
    });
    const editBtn = document.getElementById("ms-session-edit");
    if(editBtn) editBtn.addEventListener("click", ()=>{
      state.editingSessionDate = true;
      state.sessionDateInput = (state.nextSession && state.nextSession.date) || "";
      render();
    });
    const cancelSessionBtn = document.getElementById("ms-session-cancel");
    if(cancelSessionBtn) cancelSessionBtn.addEventListener("click", ()=>{ state.editingSessionDate = false; render(); });
    const saveSessionBtn = document.getElementById("ms-session-save");
    if(saveSessionBtn) saveSessionBtn.addEventListener("click", ()=>{
      const dateInput = document.getElementById("ms-session-date-input");
      if(dateInput && dateInput.value) saveNextSession(dateInput.value);
    });
    const sessionDateInputEl = document.getElementById("ms-session-date-input");
    if(sessionDateInputEl) sessionDateInputEl.addEventListener("input", e=>{ state.sessionDateInput = e.target.value; });
    const nameInput = document.getElementById("ms-rt-name");
    if(nameInput){
      nameInput.addEventListener("input", e=>{ state.rt.name = e.target.value; state.rt.lastEntryChecked = false; });
      nameInput.addEventListener("blur", ()=>{ if(state.rt.name.trim() && !state.rt.lastEntryChecked) checkLastEntry(); });
    }
    const followUpInput = document.getElementById("ms-rt-followup");
    if(followUpInput) followUpInput.addEventListener("input", e=>{ state.rt.followUp = e.target.value; });
    document.querySelectorAll("textarea.ms-input").forEach(el=>{
      el.addEventListener("input", e=>{ state.rt.answers[e.target.dataset.key] = e.target.value; });
    });
    document.querySelectorAll("input[type=radio]").forEach(el=>{
      el.addEventListener("change", e=>{ state.rt.answers[e.target.dataset.key] = e.target.value; render(); });
    });
    const submitBtn = document.getElementById("ms-rt-submit");
    if(submitBtn) submitBtn.addEventListener("click", handleRtSubmit);
    const cancelEditBtn = document.getElementById("ms-rt-cancel-edit");
    if(cancelEditBtn) cancelEditBtn.addEventListener("click", ()=>{
      state.rt.editingId = null;
      state.rt.name = ""; state.rt.answers = {}; state.rt.followUp = ""; state.rt.lastEntry = null;
      state.rt.view = "roster";
      loadRoster();
    });
  }

  function bindRtPreviewEvents(){
    const editBtn = document.getElementById("ms-rt-edit");
    if(editBtn) editBtn.addEventListener("click", ()=>{ stopSpeaking(); state.rt.view = "form"; render(); });
    const saveBtn = document.getElementById("ms-rt-save");
    if(saveBtn) saveBtn.addEventListener("click", confirmAndSaveOnesheet);
    const downloadPdfBtn = document.getElementById("ms-rt-download-pdf");
    if(downloadPdfBtn) downloadPdfBtn.addEventListener("click", downloadOnesheetPdf);
    const downloadTxtBtn = document.getElementById("ms-rt-download-txt");
    if(downloadTxtBtn) downloadTxtBtn.addEventListener("click", downloadOnesheetTxt);
    const printBtn = document.getElementById("ms-rt-print");
    if(printBtn) printBtn.addEventListener("click", ()=>{ window.print(); });
    const speakBtn = document.getElementById("ms-onesheet-speak");
    if(speakBtn) speakBtn.addEventListener("click", ()=>{
      toggleSpeak(onesheetSpeechText(state.rt.advice, state.rt.name), "onesheet");
    });
  }

  function bindRtRosterEvents(){
    const backBtn = document.getElementById("ms-rt-back");
    if(backBtn) backBtn.addEventListener("click", ()=>{ state.rt.view="form"; render(); });
    const exportBtn = document.getElementById("ms-rt-export-all");
    if(exportBtn) exportBtn.addEventListener("click", exportAllOnesheets);
    const pdfFileInput = document.getElementById("ms-roster-pdf-file");
    let pendingUploadEntryId = null;
    document.querySelectorAll(".ms-roster-upload-btn[data-entry-id]").forEach(el=>{
      el.addEventListener("click", ()=>{
        pendingUploadEntryId = el.dataset.entryId;
        state.rt.uploadError = null;
        if(pdfFileInput) pdfFileInput.click();
      });
    });
    if(pdfFileInput){
      pdfFileInput.addEventListener("change", async (e)=>{
        const file = e.target.files && e.target.files[0];
        pdfFileInput.value = "";
        if(!file || !pendingUploadEntryId) return;
        try{
          await uploadOnesheetPdf(pendingUploadEntryId, file);
          state.rt.uploadError = null;
        }catch(err){
          state.rt.uploadError = err.message;
        }
        pendingUploadEntryId = null;
        loadRoster();
      });
    }
    document.querySelectorAll(".ms-roster-action-btn[data-edit-id]").forEach(el=>{
      el.addEventListener("click", ()=>{
        const entry = state.rt.roster.find(e=>e.id===el.dataset.editId);
        if(entry) editEntry(entry);
      });
    });
    document.querySelectorAll(".ms-roster-delete-btn[data-delete-id]").forEach(el=>{
      el.addEventListener("click", async ()=>{
        const entry = state.rt.roster.find(e=>e.id===el.dataset.deleteId);
        const name = entry ? entry.name : "this entry";
        if(!confirm(`Remove ${name}'s one-sheet from the roster? This can't be undone.`)) return;
        await deleteEntry(el.dataset.deleteId);
        loadRoster();
      });
    });
  }

  document.querySelectorAll(".ms-tab-btn[data-tab]").forEach(b=>{
    b.addEventListener("click", ()=>{ state.tab = b.dataset.tab; render(); });
  });
  const profileNavBtn = document.getElementById("ms-profile-nav-btn");
  if(profileNavBtn) profileNavBtn.addEventListener("click", ()=>{
    state.showProfileSetup = true;
    render();
  });
  const lockBtn = document.getElementById("ms-lock-btn");
  if(lockBtn) lockBtn.addEventListener("click", ()=>{
    state.unlocked = false;
    state.passInput = "";
    window.storage.delete(UNLOCK_STORAGE_KEY, false).catch(()=>{});
    render();
  });
  const darkToggleBtn = document.getElementById("ms-dark-toggle");
  if(darkToggleBtn) darkToggleBtn.addEventListener("click", ()=>{
    state.darkMode = !state.darkMode;
    window.storage.set(DARKMODE_STORAGE_KEY, state.darkMode ? "true" : "false", false).catch(()=>{});
    render();
  });

  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' && state.forge.pseudoFullscreen){
      state.forge.pseudoFullscreen = false;
      render();
    }
  });
  document.addEventListener('fullscreenchange', ()=>setTimeout(sizeForgePdfFrame, 50));
  document.addEventListener('webkitfullscreenchange', ()=>setTimeout(sizeForgePdfFrame, 50));
  window.addEventListener('resize', ()=>{
    clearTimeout(window.__msForgeResizeT);
    window.__msForgeResizeT = setTimeout(sizeForgePdfFrame, 150);
  });

  (async function init(){
    try{
      try{
        const res = await withTimeout(window.storage.get(UNLOCK_STORAGE_KEY, false), 10000);
        if(res && res.value === "true") state.unlocked = true;
      }catch(e){ /* not unlocked yet */ }
      try{
        const darkRes = await withTimeout(window.storage.get(DARKMODE_STORAGE_KEY, false), 10000);
        if(darkRes && darkRes.value === "true") state.darkMode = true;
      }catch(e){ /* default light */ }
      if(state.unlocked){
        await withTimeout(loadChatHistory(), 10000).catch(()=>{});
        await withTimeout(loadProfile(), 10000).catch(()=>{});
      }
      await withTimeout(loadNextSession(), 10000).catch(()=>{});
    }catch(e){
      console.error("Init error:", e);
    }
    render();
  })();
})();
</script>
